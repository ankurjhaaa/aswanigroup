<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Oxford Blue Gradient -->
    <linearGradient id="oxfordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001C44" />
      <stop offset="100%" stop-color="#002D62" />
    </linearGradient>
    <!-- Crimson Red Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#990000" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Shield Background Container -->
  <polygon points="50,5 92,25 92,75 50,95 8,75 8,25" fill="#FFFFFF" stroke="#001C44" stroke-width="1.5" />
  
  <!-- Stylized Interlocking Monogram/Shapes (A & G representation) -->
  <g transform="translate(1, 2)">
    <!-- Left Pillar (Oxford Blue) -->
    <path d="M32 72 L45 28 L53 52" fill="none" stroke="url(#oxfordGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Pillar (Crimson) -->
    <path d="M47 48 L55 28 L68 72" fill="none" stroke="url(#crimsonGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Intersecting bridge representing the crossbar and G-loop -->
    <path d="M38 56 L62 56 L62 66" fill="none" stroke="url(#oxfordGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
